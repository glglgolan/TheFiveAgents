<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אבא אדמה — סרט פרישה לשוקי</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --line:#2c313c;
    --ink:#e8eaed; --dim:#9aa0aa; --accent:#f0a63c; --focus:#5aa9e6;
    --regen:#e0574b; --multi:#8b5cf6; --ok:#3fb950; --pending:#6b7280; --draft:#d9822b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Heebo",Arial,sans-serif;padding:20px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--dim);font-size:13px}
  .stats{margin-inline-start:auto;display:flex;gap:18px;font-size:13px;color:var(--dim)}
  .stats b{color:var(--ink)}
  .bar{font-size:12px;color:var(--dim);margin:12px 0 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  button{background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:#3a4150;transform:translateY(-2px)}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--card2);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{color:var(--pending);font-size:12px;text-align:center;padding:8px;line-height:1.5}
  .ph .big{font-size:26px;opacity:.5;display:block;margin-bottom:4px}
  .num{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.72);
    color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 9px}
  .badges{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:5px}
  .b{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;color:#fff}
  .b.regen{background:var(--regen)} .b.multi{background:var(--multi)}
  .b.done{background:var(--ok)} .b.draft{background:var(--draft)}
  .thumb img.isdraft{filter:saturate(.82) brightness(.94)}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .title{font-size:13.5px;font-weight:600;line-height:1.35}
  .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .meta .t{color:var(--accent);font-weight:600}
  .chars{display:flex;gap:4px;flex-wrap:wrap}
  .cc{font-size:10px;background:var(--card2);border:1px solid var(--line);
    border-radius:20px;padding:1px 8px;color:var(--dim)}
  .narr{font-size:11.5px;color:var(--dim);line-height:1.5;
    border-inline-start:2px solid var(--line);padding-inline-start:8px;margin-top:2px}
  footer{margin-top:20px;color:var(--dim);font-size:11px;text-align:center;line-height:1.7}
  kbd{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>🎬 אבא אדמה — סרט פרישה לשוקי</h1>
  <span class="sub" id="subtitle"></span>
  <div class="stats">
    <span><b id="sceneCount">–</b> סצנות</span>
    <span><b id="totalDur">–</b></span>
    <span><b id="imgCount">–</b> תמונות</span>
  </div>
</header>

<div class="bar">
  <button onclick="location.reload()">↻ רענן (טען תמונות חדשות)</button>
  <span class="chip"><span class="dot" style="background:var(--ok)"></span> נוצרה</span>
  <span class="chip"><span class="dot" style="background:var(--draft)"></span> טיוטה (draft)</span>
  <span class="chip"><span class="dot" style="background:var(--pending)"></span> ממתינה</span>
  <span class="chip"><span class="dot" style="background:var(--regen)"></span> regen</span>
  <span class="chip"><span class="dot" style="background:var(--multi)"></span> ריבוי תמונות</span>
</div>

<div class="grid" id="grid"></div>

<footer>
  תמונות ב-<code>scenes/</code> · מתעדכן ב-<kbd>↻ רענן</kbd> או <kbd>⌘R</kbd><br>
  נוצר אוטומטית מ-<code>storyboard.json</code>
</footer>

<script>
const DATA = {"subtitle": "אבא אדמה — סרט פרישה לשוקי", "scenes": [{"n": 1, "title": "פתיחה — זריחה על השדות ✨", "dur": 8, "chars": ["the_land"], "narr": "על רקע תכלת שמיים ענני קטיפה, שלחה השמש קרניים ובחום את הרוח ליטפה. יש אנשים שסופרים שנים, ויש אנשים שסופרים ע…", "ref": "—", "shot": "EWS", "regen": false, "multi": false}, {"n": 2, "title": "שוקי בתוך השדה", "dur": 6, "chars": ["shuki", "the_land"], "narr": "ושותלים עם המון אהבה ותקווה לרגע שבו זרע קטן מחליט להפוך לחיים. שלושים ושש שנים — שוקי לא עבד את האדמה, הוא חי…", "ref": "shuki-01.png", "shot": "MLS", "regen": false, "multi": false}, {"n": 3, "title": "האדמה מדברת ✨", "dur": 7, "chars": ["shuki", "the_land"], "narr": "אני האדמה: 13,260 ימים שהוא מגיע בכל בוקר, עוד לפני שקרני השמש מתחילות לחמם אותי. הוא מברך אותי ואת הזרעים שזו…", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 4, "title": "העונות חולפות ✨", "dur": 10, "chars": ["shuki", "the_land"], "narr": "עוד עונה, ועוד אחת. עוד חריש, עוד קציר. עגבניות, כותנה, חיטה, תירס — ומרבדים של שקדים. בכל עונה מחדש, בהתרגשות…", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 5, "title": "מי שרואה מה שאחרים מפספסים", "dur": 6, "chars": ["shuki"], "narr": "במקום בו כולם רואים שדה, הוא רואה מערכת אקולוגית שלמה. הוא מכיר כל קלח, כל עכבר וכל חיפושית. רק רואה את קצה הע…", "ref": "—", "shot": "ECU", "regen": false, "multi": false}, {"n": 6, "title": "השועל בין השורות", "dur": 8, "chars": ["shuki"], "narr": "ופתאום, באמצע יום עבודה, שועל מציץ מבין השורות. והוא נעצר לרגע, ומתפעל ממנו כאילו זו הפעם הראשונה. כי גם אחרי…", "ref": "shuki-01.png", "shot": "MCU", "regen": false, "multi": false}, {"n": 7, "title": "שעונים ושירים", "dur": 7, "chars": ["shuki", "workshop"], "narr": "וכשהיום בשדה מסתיים, הסקרנות לא נגמרת. בבית מחכים לו שעונים שמבקשים יד מתקנת, ומחברת שבה הוא כותב שירים. ביד א…", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 8, "title": "מסדר התירס 😂", "dur": 6, "chars": ["shuki"], "narr": "הומור: קלחי התירס מצדיעים. אחד לוחש: 'הוא מגיע.' כולם נעמדים.", "ref": "shuki-01.png", "shot": "MLS", "regen": false, "multi": false}, {"n": 9, "title": "האנשים שבדרך — משפחה", "dur": 8, "chars": ["shuki", "thai_workers"], "narr": "עם השנים הוא לא גידל רק יבולים. הוא גידל ביטחון תזונתי, אמון, חברויות. אנשים שהגיעו מארץ רחוקה — ועשה כל מה שי…", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 10, "title": "שיעור תאילנדית 😂", "dur": 7, "chars": ["shuki", "thai_workers"], "narr": "הומור: העובדים מלמדים אותו תאילנדית — פרצי צחוק ומחוות משועשעות באמצע יום העבודה.", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 11, "title": "ארוחת הבוקר הקדושה 😂", "dur": 8, "chars": ["shuki", "thai_workers"], "narr": "והוא? עם תפריט שלא משתנה: טונה, שמנת, אבוקדו ולחם טרי, שמנגבים בדוך או בסיבוב. הומור: העובדים התאילנדים מסתכלי…", "ref": "shuki-01.png", "shot": "MCU", "regen": false, "multi": false}, {"n": 12, "title": "הגבול בתלם האחרון", "dur": 7, "chars": ["shuki", "the_land"], "narr": "הגבול על המפה — הוא תמיד ראה אותו בתלם האחרון. שם הסתיימה החלקה, ושם התחילה המדינה.", "ref": "shuki-01.png", "shot": "LS", "regen": false, "multi": false}, {"n": 13, "title": "שריפות — והוא לא ויתר", "dur": 8, "chars": ["shuki", "the_land"], "narr": "במשך חודשים השריפות כילו את השדות, העשן כיסה את השמיים. אבל הוא לא ויתר, ולקח חלק פעיל בכיבוי השריפות. כי כשהא…", "ref": "shuki-01.png", "shot": "MLS", "regen": false, "multi": false}, {"n": 14, "title": "השבעה באוקטובר — אתם לא לבד", "dur": 8, "chars": ["shuki", "the_land"], "narr": "ואז הגיע היום שבו הכול השתנה — השבעה באוקטובר. כשכולנו ניסינו להתרחק מאתרי הזוועות, הוא כבר היה בדרך לבארי, עם…", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}, {"n": 15, "title": "תלם חדש — אנחנו ממשיכים", "dur": 9, "chars": ["the_land"], "narr": "וכשהשדות עוד דיממו, הוא חזר אליהם, חרש אותם מחדש. וזו הייתה הדרך שלו לומר: אנחנו ממשיכים. שדות חרוכים, טרקטור,…", "ref": "—", "shot": "LS", "regen": false, "multi": false}, {"n": 16, "title": "תודה מהאדמה ✨", "dur": 8, "chars": ["shuki", "the_land"], "narr": "שוקי עובד מתוך אהבה. במשך שלושים ושש שנים הוא טיפל באדמה במסירות, וגם ברגעים הקשים ביותר בחר לחזור אליה. ואולי…", "ref": "shuki-01.png", "shot": "MLS", "regen": false, "multi": false}, {"n": 17, "title": "שתילה אחרונה", "dur": 7, "chars": ["shuki", "the_land"], "narr": "אומרים שפרישה היא סוף, אבל בטבע אין סוף — תמיד יש עונה שנגמרת ואחת חדשה שמתחילה. שלושים ושש שנים של נתינה, של…", "ref": "shuki-01.png", "shot": "MCU", "regen": false, "multi": false}, {"n": 18, "title": "הסיום — עץ החיים ✨", "dur": 10, "chars": ["shuki", "thai_workers", "the_land"], "narr": "שוט סיום: הוא שותל שתיל קטן, המצלמה מתרחקת, והשתיל גדל לעץ ענק שהופך לפסיפס של שקדים, עגבניות, כותנה ותירס. המ…", "ref": "shuki-01.png", "shot": "EWS", "regen": false, "multi": false}, {"n": 19, "title": "האדמה מדברת — הצעדים המוכרים ✨", "dur": 8, "chars": ["shuki", "the_land"], "narr": "13,260 ימים שהוא מגיע בכל בוקר, עוד לפני שקרני השמש מתחילות לחמם אותי. אחרי כל כך הרבה שנים, נדמה שגם השדות כב…", "ref": "shuki-01.png", "shot": "MLS", "regen": false, "multi": false}, {"n": 20, "title": "האדמה מדברת — טיפול ומסירות ✨", "dur": 8, "chars": ["shuki", "the_land"], "narr": "הוא מכיר כל חלקה, כל עץ וכל תלם ומטפל בהם במסירות אין קץ. דואג לי למינרלים ולויטמינים, משקה ומדשן אותי בדיוק מ…", "ref": "shuki-01.png", "shot": "MCU", "regen": false, "multi": false}, {"n": 21, "title": "מרבדים של שקדים — המשך האורביט ✨", "dur": 10, "chars": ["shuki", "the_land"], "narr": "עגבניות, כותנה, חיטה, תירס — ומרבדים של שקדים. בכל עונה מחדש, בהתרגשות כאילו זו הפעם הראשונה.", "ref": "shuki-01.png", "shot": "MS", "regen": false, "multi": false}]};
const SCENES_DIR = "scenes";

const grid = document.getElementById('grid');

let draftCount = 0, doneCount = 0;

DATA.scenes.forEach(s=>{
  const card = document.createElement('div');
  card.className='card';

  const nn = String(s.n).padStart(2,'0');
  const stem = s.multi ? `s${nn}a` : `s${nn}`;         // first image of the scene
  const finalSrc = `${SCENES_DIR}/${stem}.png`;
  const draftSrc = `${SCENES_DIR}/${stem}_draft.png`;

  const badges = [];
  if(s.regen) badges.push('<span class="b regen">REGEN</span>');
  if(s.multi) badges.push('<span class="b multi">×N</span>');

  const chars = (s.chars||[]).map(c=>`<span class="cc">${c}</span>`).join('');

  card.innerHTML = `
    <div class="thumb">
      <span class="num">S${nn}</span>
      <div class="badges">${badges.join('')}</div>
      <img alt="scene ${s.n}" data-stage="final">
      <div class="ph"><span class="big">🎞️</span>${s.dur}s · ${s.shot}<br>ממתינה ליצירה</div>
    </div>
    <div class="body">
      <div class="title">${s.title}</div>
      <div class="meta"><span class="t">${s.dur}s</span><span>${s.shot}</span>${s.ref!=='—'?`<span>📎 ${s.ref}</span>`:'<span>—</span>'}</div>
      <div class="chars">${chars||'<span class="cc">— ללא דמות —</span>'}</div>
      <div class="narr">${s.narr}</div>
    </div>`;

  const img = card.querySelector('img');
  const thumb = img.parentElement;
  img.onload = ()=>{
    thumb.querySelector('.ph')?.remove();
    const badgeBox = thumb.querySelector('.badges');
    if(img.dataset.stage === 'draft'){
      img.classList.add('isdraft');
      badgeBox.insertAdjacentHTML('afterbegin','<span class="b draft">טיוטה</span>');
      draftCount++;
    } else {
      badgeBox.insertAdjacentHTML('afterbegin','<span class="b done">✓</span>');
      doneCount++;
    }
    document.getElementById('imgCount').textContent = `${doneCount}✓ · ${draftCount} טיוטה`;
  };
  img.onerror = ()=>{
    if(img.dataset.stage === 'final'){          // no final → try the low-quality draft
      img.dataset.stage = 'draft';
      img.src = draftSrc;
    } else {                                     // no draft either → leave placeholder
      img.style.display = 'none';
    }
  };
  img.src = finalSrc;                            // start by attempting the final

  grid.appendChild(card);
});

const total = DATA.scenes.reduce((a,s)=>a+(s.dur||0),0);
document.getElementById('subtitle').textContent = DATA.subtitle || '';
document.getElementById('sceneCount').textContent = DATA.scenes.length;
document.getElementById('totalDur').textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
document.getElementById('imgCount').textContent = '…';
</script>
</body>
</html>
