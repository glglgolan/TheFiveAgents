const DATA = {"header": "# תסריט קריינות ל-ElevenLabs — בארסה\n\n**פרויקט:** נִירְאֵּל ואַאמְנון · **סרט:** סרט החתונה מנקודת המבט של בארסה · **שפה:** עברית  \n**מקור:** `bambi/input/nirel-amnon/voiceover_script final.docx` — קריינות מלאה, מסודרת לפי הסדר הסופי שסימנת בקובץ (סצנות ראשיות + סצנות אקשן משולבות ביניהן).  \n**סה\"כ:** 57 קטעי קריינות (כולל סצנה 32.5) + 15 סצנות אקשן ללא קריינות עצמאית · אורך וידאו מתוכנן 559 שניות (~9:19)\n\n---\n\n## הנחיות קול — בארסה (מתוך PRODUCTION NOTES)\n\nקול המספרת חייב להיות:\n\n- **נשי**\n- **בטוח** — בלי היסוס, בלי עלייה בסוף משפט\n- **יבש** — הומור שנמסר ישר, בלי לחייך בקול\n- **חם מתחת לסרקזם** — הלגלוג הוא כיסוי, לא המהות\n- **אנרגיית קריין דוקומנטרי** — כמו הגשת סרט טבע רציני, בקצב מדוד\n- **לחישה מדי פעם לפאנץ'-ליין** — הורדת ווליום ואינטימיות בשורה האחרונה של בדיחה\n- **לעולם לא \"חתולה מצוירת\"** — אפס אפקטים קוליים, אפס קול ילדותי\n\n### פרמטרים מומלצים ב-ElevenLabs\n\n| פרמטר | ערך | למה |\n|--------|------|------|\n| Model | **v3** (חובה — התסריט משתמש בתגי אודיו של v3) | תגי אודיו + עברית |\n| Stability | 45–55 | מספיק יציב לדוקו, מספיק חופש להומור |\n| Similarity | 75–85 | שמירה על זהות הקול לאורך 57 קטעים |\n| Style exaggeration | 15–25 | נמוך — היובש הוא העניין |\n| Speaker boost | On | |\n\n### שיטת עבודה — תגי אודיו של v3 (לא break tags בכל מקום)\n\nהתסריט הזה בנוי על [תגי האודיו של ElevenLabs v3](https://elevenlabs.io/blog/v3-audiotags) בתוך הטקסט עצמו (`[dryly]`, `[whispers]`, `[sarcastically]`, `[warmly]`, `[softly]`, `[excited]`, `[happily]`, `[awe]`, `[rushed]`, `[laughs softly]`) — **לא** שרשרת `<break>` בין כל שתי מילים. הפסקות טבעיות (`…`, `-`, פסיקים) מספיקות לרוב לקצב; נשאר `<break time=\"1.2s\"/>` **פעם אחת בלבד** בכל התסריט (סצנה 19), במקום שבו יש מעבר טונלי אמיתי (מרוגע לירי חצוץ) שדורש חיתוך שקט מוחלט, לא רק נשימה.\n\n1. **הקלט קטע-קטע לפי סצנה** (ולא ברצף אחד) — כך כל קובץ אודיו מתיישר מול קליפ הווידאו שלו ב-`video-editor`.\n2. שמור כל קטע כ-`production/vo/sNN.mp3` (לפי מספר הסצנה המקורי, לא לפי סדר ההופעה בסרט).\n3. `[whispers]` הוא התג הרשמי ללחישה ב-v3 — אין צורך יותר בטייק נפרד; ElevenLabs מבצע את זה בתוך אותה הקלטה.\n4. אם קול מסוים \"מקריא\" תג בקול רם במקום לבצע אותו — הקול לא תומך בטווח הרגשי הזה; נסה טייק נוסף או בחר קול עם טווח רחב יותר (ראה FAQ בבלוג).\n5. מילים מנוקדות (כמו בְּמִיאָוֹוֹלוּאִים, חֲתוּלָה-נוֹבֵלָה, לַחֲתוּלִיזַצְיָה, מִיאָווֹ-שְׁלֵמִים, וָאתְחָה) הן מילים מומצאות — הניקוד נקבע לפי ההנחיה שלך; אם ה-TTS עדיין קורא אותן לא נכון, נסה טייק נוסף עם רווח/מקף נוסף בין החלקים.\n6. אחרי שכל הקטעים מוכנים — שרשור לקובץ אחד → `--voiceover` ב-`video-editor` עם `--fit-to-audio`.\n\n### הופעת אורח של בטטה (מוקלט מראש — לא לייצר טקסט חדש)\n\nיש כבר שתי הקלטות ElevenLabs אמיתיות ב-`bambi/input/nirel-amnon/` (voice preset **\"Potato - Earthy & Rooted\"**), שתומללו:\n\n- `ElevenLabs_2026-08-28T05_00_14_Potato...mp3` (5.7 שנ׳): *\"היי! אני בטטא! היא לא נתנה לי שורה אחת לדבר בקריינות הזאת.\"*\n- `ElevenLabs_2026-08-26T21_33_28_Potato...mp3` (4.0 שנ׳): *\"יחד. כל הדרך. פוטייטו פוטאטו.\"*\n\n**התוכנית (טרם בוצעה בפועל — זו רק תיעוד/הוראה לעריכה):** לחתוך את שתי ההקלטות ל-3 קבצי קול נפרדים (הפסקה טבעית בהקלטה הראשונה נמצאת בסביבות 2.0–2.6 שנ׳, בין \"אני בטטא!\" ל\"היא לא נתנה לי...\"):\n\n1. **\"היי! אני בטטא!\"** — פרץ כניסה\n2. **\"היא לא נתנה לי שורה אחת לדבר בקריינות הזאת.\"** — התלוננות, שוברת קיר רביעי\n3. **\"יחד. כל הדרך. פוטייטו פוטאטו.\"** — משפט סיום (הקובץ השני, שלם)\n\n**מיקום מוצע:** מיד אחרי הקריינות של **סצנה 29** (\"נכנסת בטטה\" — \"...מזכירה לכם מישהו?\") — בטטה קוטעת את בארסה בקולה האמיתי בדיוק ברגע שבו היא מוצגת, לפני שממשיכים לסצנה 30. זה רק הצעה — תגיד אם אתה רוצה מיקום אחר בסרט.\n\n---", "scenes": [{"num": "1", "title": "המרדף — פתיחה", "meta": "`15 שנ׳` · shot: MLS · דמויות: barsa", "notes": [], "text": "[dryly] זה היה סיפור אהבה מיוחד מהרגע הראשון- היא אמרה מיאו, הוא אמר מיאו והשאר היסטוריה. [sarcastically] תקראו לזה גורל, או אהבה ממבט ראשון. ואני? [warmly] אני מאמינה שאם משהו חשוב באמת… צריך לרדוף אחריו.", "after": []}, {"num" function esc(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function highlightTags(text){
  return esc(text).replace(/\[([a-zA-Z][a-zA-Z ]*)\]/g, '<span class="tagword">[$1]</span>');
}

async function copyText(btn, text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = "הועתק ✓";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); }, 1400);
}

document.getElementById("sceneCount").textContent = DATA.scenes.length;

const list = document.getElementById("list");
let html = "";
for (const s of DATA.scenes) {
  html += `
    <div class="card">
      <div class="card-head">
        <div class="titleblock">
          <span class="num">${esc(s.num)}</span>
          <span class="title">${esc(s.title)}</span>
        </div>
        <button class="copy-btn" data-num="${esc(s.num)}">העתק</button>
      </div>
      <div class="meta">${esc(s.meta.replace(/\`/g, ""))}</div>
      ${s.notes.map(n => `<div class="note">${esc(n)}</div>`).join("")}
      <div class="text">${highlightTags(s.text)}</div>
      ${s.after.map(a => `<div class="after">${esc(a)}</div>`).join("")}
    </div>
  `;
}
list.innerHTML = html;

list.querySelectorAll(".copy-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const num = btn.getAttribute("data-num");
    const scene = DATA.scenes.find(s => s.num === num);
    copyText(btn, scene.text);
  });
});

document.getElementById("copyAllPlain").addEventListener("click", (e) => {
  const all = DATA.scenes.map(s => `סצנה ${s.num} — ${s.title}\n${s.text}`).join("\n\n");
  copyText(e.target, all);
});

document.getElementById("copyAllFull").addEventListener("click", (e) => {
  copyText(e.target, DATA.raw);
});
