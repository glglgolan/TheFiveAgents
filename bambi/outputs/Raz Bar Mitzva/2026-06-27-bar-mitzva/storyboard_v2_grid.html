<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רז — הדרך היחידה להפסיד היא לוותר (v2)</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --line:#2c313c;
    --ink:#e8eaed; --dim:#9aa0aa; --accent:#f0a63c; --focus:#5aa9e6;
    --regen:#e0574b; --multi:#8b5cf6; --ok:#3fb950; --pending:#6b7280; --draft:#d9822b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Heebo",Arial,sans-serif;padding:20px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--dim);font-size:13px}
  .stats{margin-inline-start:auto;display:flex;gap:18px;font-size:13px;color:var(--dim)}
  .stats b{color:var(--ink)}
  .bar{font-size:12px;color:var(--dim);margin:12px 0 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  button{background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:#3a4150;transform:translateY(-2px)}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--card2);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{color:var(--pending);font-size:12px;text-align:center;padding:8px;line-height:1.5}
  .ph .big{font-size:26px;opacity:.5;display:block;margin-bottom:4px}
  .num{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.72);
    color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 9px}
  .badges{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:5px}
  .b{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;color:#fff}
  .b.regen{background:var(--regen)} .b.multi{background:var(--multi)}
  .b.done{background:var(--ok)} .b.draft{background:var(--draft)}
  .thumb img.isdraft{filter:saturate(.82) brightness(.94)}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .title{font-size:13.5px;font-weight:600;line-height:1.35}
  .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .meta .t{color:var(--accent);font-weight:600}
  .chars{display:flex;gap:4px;flex-wrap:wrap}
  .cc{font-size:10px;background:var(--card2);border:1px solid var(--line);
    border-radius:20px;padding:1px 8px;color:var(--dim)}
  .narr{font-size:11.5px;color:var(--dim);line-height:1.5;
    border-inline-start:2px solid var(--line);padding-inline-start:8px;margin-top:2px}
  footer{margin-top:20px;color:var(--dim);font-size:11px;text-align:center;line-height:1.7}
  kbd{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>🎬 רז — הדרך היחידה להפסיד היא לוותר (v2)</h1>
  <span class="sub" id="subtitle"></span>
  <div class="stats">
    <span><b id="sceneCount">–</b> סצנות</span>
    <span><b id="totalDur">–</b></span>
    <span><b id="imgCount">–</b> תמונות</span>
  </div>
</header>

<div class="bar">
  <button onclick="location.reload()">↻ רענן (טען תמונות חדשות)</button>
  <span class="chip"><span class="dot" style="background:var(--ok)"></span> נוצרה</span>
  <span class="chip"><span class="dot" style="background:var(--draft)"></span> טיוטה (draft)</span>
  <span class="chip"><span class="dot" style="background:var(--pending)"></span> ממתינה</span>
  <span class="chip"><span class="dot" style="background:var(--regen)"></span> regen</span>
  <span class="chip"><span class="dot" style="background:var(--multi)"></span> ריבוי תמונות</span>
</div>

<div class="grid" id="grid"></div>

<footer>
  תמונות ב-<code>scenes_v2/</code> · מתעדכן ב-<kbd>↻ רענן</kbd> או <kbd>⌘R</kbd><br>
  נוצר אוטומטית מ-<code>storyboard_v2.json</code>
</footer>

<script>
const DATA = {"subtitle": "רז — הדרך היחידה להפסיד היא לוותר (v2)", "scenes": [{"n": 1, "title": "פתיחה — רז נולד בתנועה (שלג בעפרה)", "dur": 16, "chars": [], "narr": "יש ילדים שנולדים עם כישרון. יש כאלה שנולדים עם חלום. ורז? רז נולד בתנועה. הוא הגיע לעולם בקיץ, בעפרה, וכבר בחו…", "ref": "ofra.webp", "shot": "EWS", "regen": false, "multi": false}, {"n": 2, "title": "השורשים — סבתא רות וסבא דוד", "dur": 14, "chars": ["grandparents_amos"], "narr": "המסע של רז מתחיל הרבה לפני הצעד הראשון שלו. הוא מתחיל בשורשים, בסבים ובסבתות: סבתא רות וסבא דוד…", "ref": "grandparents-amos-raz4-131.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 3, "title": "השורשים — סבתא מיכל וסבא רפי", "dur": 14, "chars": ["grandparents_adi"], "narr": "…סבתא מיכל וסבא רפי. ארבעתם מביאים איתם אהבה, ערכים, נתינה וחום, ואל הבתים שלהם תמיד אפשר לחזור ולמצוא מקום בו…", "ref": "grandparents-adi-kisim-228.jpg", "shot": "MS", "regen": true, "multi": false}, {"n": 4, "title": "עדי ועמוס — חתונה", "dur": 16, "chars": ["adi_amos_wedding"], "narr": "ואז, נפגשו אמא עדי ואבא עמוס, שבחרו ללכת יחד בדרך משותפת ולהקים בית מלא באהבה ועשייה, בית בו כל ילד יכול להיות…", "ref": "wedding-mg-8869.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 5, "title": "שנה אחרי החתונה — נולד רז", "dur": 16, "chars": ["raz_toddler", "mom_adi", "dad_amos"], "narr": "שנה אחרי החתונה נולד רז, ומהרגע הראשון היה ברור שהוא לא מתכוון לעמוד במקום.", "ref": "2026-parents-kisim-109.jpg", "shot": "MCU", "regen": false, "multi": false}, {"n": 6, "title": "האהבה הראשונה — מכוניות (ישן עם כולן)", "dur": 16, "chars": ["raz_toddler"], "narr": "עוד לפני שידע לקרוא, ולפני שעלה לכיתה א', הייתה לו אהבה אחת שאי אפשר היה לפספס. מכוניות. לא רק לשחק בהן. לא רק…", "ref": "2016-toddler-zoomz.jpg", "shot": "MCU", "regen": true, "multi": false}, {"n": 7, "title": "בגיל שנה — בית גמליאל", "dur": 14, "chars": ["raz_toddler", "mom_adi"], "narr": "בגיל שנה הוא הגיע לבית גמליאל, שהפך לביתו עד היום.", "ref": "2016-toddler-zoomz.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 8, "title": "האחים — צמד שהפך לשלישייה מנצחת", "dur": 18, "chars": ["raz_child", "yair", "tomer"], "narr": "אל הבית במושב הצטרף יאיר, ומאז הם צמד: אחים שהם החברים הכי טובים, משלימים זה את זה. כעבור כמה שנים, הצטרף תומר…", "ref": "2021-likrat-hachoref-29.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 9, "title": "אבא עמוס רץ — כולם מנסים לעקוב", "dur": 16, "chars": ["dad_amos", "mom_adi", "raz_teen", "yair", "tomer"], "narr": "מאחורי כל ילד עומדים אנשים שמעצבים אותו. אמא עדי, שמצלמת ומתעדת אירועים מיוחדים, ומזכירה לכולם לעצור ולהסתכל ע…", "ref": "—", "shot": "MS", "regen": false, "multi": false}, {"n": 10, "title": "השילוב הנדיר — גובה מאמא, לב ענק", "dur": 14, "chars": ["raz_teen", "mom_adi"], "narr": "ואולי, דווקא השילוב ביניהם הוא שהפך את רז למי שהוא. רז הוא ילד של אנשים, של עשייה ושל נחישות. הוא פיקח, אכפתי,…", "ref": "—", "shot": "MLS", "regen": false, "multi": true}, {"n": 11, "title": "מסורות — פנקייקים, פיצות, והשניצלים שרזי מטגן", "dur": 18, "chars": ["raz_teen", "dad_amos", "yair", "tomer"], "narr": "וכמו בכל משפחה, גם אצלנו יש מסורות קטנות, שהפכו לזיכרונות גדולים: פנקייקים של ימי ראשון, ערב פיצות מעשה ידי אב…", "ref": "2026-teen-book-raz-10.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 12, "title": "טאיה — כולם מפחדים מכלבים, חוץ מרז", "dur": 16, "chars": ["raz_teen", "taya", "yair", "tomer"], "narr": "איך אפשר לספר על המשפחה מבלי להזכיר את טאיה הכלבה שלנו, שהגיעה לבית שבו כולם מפחדים מכלבים — חוץ מרז כמובן — ו…", "ref": "2024-teen-raz-tomer-19.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 13, "title": "רגעים שקטים — זום אנגלית עם סבא דוד", "dur": 14, "chars": ["raz_child", "grandparents_amos"], "narr": "יש גם את הרגעים השקטים יותר. זמן האיכות עם סבא דוד בזום ללימוד אנגלית.", "ref": "2023-child-shkediot-33.jpg", "shot": "MCU", "regen": true, "multi": false}, {"n": 14, "title": "הביקורים ברמת ישי — עוגות וחיבוקים", "dur": 16, "chars": ["raz_teen", "grandparents_adi"], "narr": "הביקורים אצל סבתא וסבא ברמת ישי עם העוגות הכי שוות והחיבוקים הכי גדולים. התחושה שתמיד טוב להיות ביחד.", "ref": "grandparents-adi-kisim-228.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 15, "title": "ביזבז — עוד דקה של מתיחות", "dur": 14, "chars": ["raz_teen", "dad_amos", "yair"], "narr": "המשפחה שלנו לא עוצרת לרגע, אבל רז אוהב לקחת דקה ועוד דקה של מתיחות, בדיוק כשצריך לצאת מהבית, עוד סיבוב אחד לוו…", "ref": "shavuot-2025-148.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 16, "title": "בוקר — 6:30 מצלצל, 6:45 קם", "dur": 18, "chars": ["raz_teen"], "narr": "איך נראה יום בחיים של רז? השעון מצלצל ב-6:30. הוא מתעורר ב-6:45. מסדר את המיטה. מצחצח שיניים.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MCU", "regen": false, "multi": false}, {"n": 17, "title": "טיול עם טאיה + קורנפלקס", "dur": 14, "chars": ["raz_teen", "taya"], "narr": "יוצא לטיול הבוקר עם טאיה. אוכל קערת קורנפלקס גדושה. וקדימה, לעולם.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 18, "title": "סקייטבורד — חורש את הרחובות", "dur": 14, "chars": ["raz_teen"], "narr": "וברגע שהוא יוצא, הוא פשוט לא עוצר. תראו אותו על הסקטבורד, חורש את הרחובות.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 19, "title": "קראטה — המשמעת העצמית המפורסמת", "dur": 16, "chars": ["raz_teen"], "narr": "או רץ לאימוני קרטה, בהם הוא מביא לידי ביטוי את המשמעת העצמית המפורסמת שלו.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MS", "regen": true, "multi": false}, {"n": 20, "title": "ריצות עם אבא", "dur": 14, "chars": ["raz_teen", "dad_amos"], "narr": "או יוצא לריצה עם אבא. כל פעם בדרך אחרת, אבל תמיד עם אותה נחישות.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 21, "title": "לא מוותר — לימודים, ספורט, שחמט", "dur": 16, "chars": ["raz_teen"], "narr": "הוא לא מוותר לעצמו. לא בלימודים, שם הוא מצטיין, ולא בספורט. לא בשחמט. הוא תמיד מחפש להשתפר. עוד קצת. עוד צעד.…", "ref": "2026-teen-book-raz-22.jpg", "shot": "MCU", "regen": false, "multi": false}, {"n": 22, "title": "חלום — ספורטאי מקצועי (כדורגל / כדורסל)", "dur": 16, "chars": ["raz_teen"], "narr": "ויש גם חלומות. להיות ספורטאי מקצועי בכדורגל או בכדורסל.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 23, "title": "חלום — גיטרה", "dur": 14, "chars": ["raz_teen"], "narr": "ללמוד גיטרה.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 24, "title": "חלום — צלילה וגלישה", "dur": 14, "chars": ["raz_teen"], "narr": "לצלוח קורס צלילה וגלישה.", "ref": "2026-teen-book-raz-10.jpg", "shot": "MLS", "regen": false, "multi": false}, {"n": 25, "title": "חלומות — ברבר, ניו זילנד, טלפורטציה", "dur": 18, "chars": ["raz_teen"], "narr": "ללמוד לספר חברים. ואולי יום אחד גם להגיע לניו זילנד הרחוקה. ואם הוא היה יכול לקבל כוח-על? הוא היה מבקש טלפורטצ…", "ref": "2026-teen-book-raz-10.jpg", "shot": "MS", "regen": false, "multi": false}, {"n": 26, "title": "רגעים שקטים — ספר, מוזיקה, חברים, פלייסטיישן", "dur": 26, "chars": ["raz_teen"], "narr": "בין כל העשייה הזו, רז יודע לעצור לרגע. לצלול אל תוך ספר טוב, להיסחף לעולמות חדשים ולתת לדמיון להוביל את הדרך.…", "ref": "2026-teen-book-raz-22.jpg", "shot": "MCU", "regen": false, "multi": true}, {"n": 27, "title": "סיום — רז שלנו, היום אתה חוגג בר מצווה", "dur": 40, "chars": ["raz_teen", "mom_adi", "dad_amos", "yair", "tomer", "taya"], "narr": "והנה, היום החגיגי שלך הגיע. רז שלנו, היום אתה חוגג בר מצווה. כשאנחנו מסתכלים עליך היום, אנחנו רואים נער גבוה,…", "ref": "2026-teen-book-raz-10.jpg", "shot": "MS", "regen": false, "multi": false}]};
const SCENES_DIR = "scenes_v2";

const grid = document.getElementById('grid');

let draftCount = 0, doneCount = 0;

DATA.scenes.forEach(s=>{
  const card = document.createElement('div');
  card.className='card';

  const nn = String(s.n).padStart(2,'0');
  const stem = s.multi ? `s${nn}a` : `s${nn}`;         // first image of the scene
  const finalSrc = `${SCENES_DIR}/${stem}.png`;
  const draftSrc = `${SCENES_DIR}/${stem}_draft.png`;

  const badges = [];
  if(s.regen) badges.push('<span class="b regen">REGEN</span>');
  if(s.multi) badges.push('<span class="b multi">×N</span>');

  const chars = (s.chars||[]).map(c=>`<span class="cc">${c}</span>`).join('');

  card.innerHTML = `
    <div class="thumb">
      <span class="num">S${nn}</span>
      <div class="badges">${badges.join('')}</div>
      <img alt="scene ${s.n}" data-stage="final">
      <div class="ph"><span class="big">🎞️</span>${s.dur}s · ${s.shot}<br>ממתינה ליצירה</div>
    </div>
    <div class="body">
      <div class="title">${s.title}</div>
      <div class="meta"><span class="t">${s.dur}s</span><span>${s.shot}</span>${s.ref!=='—'?`<span>📎 ${s.ref}</span>`:'<span>—</span>'}</div>
      <div class="chars">${chars||'<span class="cc">— ללא דמות —</span>'}</div>
      <div class="narr">${s.narr}</div>
    </div>`;

  const img = card.querySelector('img');
  const thumb = img.parentElement;
  img.onload = ()=>{
    thumb.querySelector('.ph')?.remove();
    const badgeBox = thumb.querySelector('.badges');
    if(img.dataset.stage === 'draft'){
      img.classList.add('isdraft');
      badgeBox.insertAdjacentHTML('afterbegin','<span class="b draft">טיוטה</span>');
      draftCount++;
    } else {
      badgeBox.insertAdjacentHTML('afterbegin','<span class="b done">✓</span>');
      doneCount++;
    }
    document.getElementById('imgCount').textContent = `${doneCount}✓ · ${draftCount} טיוטה`;
  };
  img.onerror = ()=>{
    if(img.dataset.stage === 'final'){          // no final → try the low-quality draft
      img.dataset.stage = 'draft';
      img.src = draftSrc;
    } else {                                     // no draft either → leave placeholder
      img.style.display = 'none';
    }
  };
  img.src = finalSrc;                            // start by attempting the final

  grid.appendChild(card);
});

const total = DATA.scenes.reduce((a,s)=>a+(s.dur||0),0);
document.getElementById('subtitle').textContent = DATA.subtitle || '';
document.getElementById('sceneCount').textContent = DATA.scenes.length;
document.getElementById('totalDur').textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
document.getElementById('imgCount').textContent = '…';
</script>
</body>
</html>
