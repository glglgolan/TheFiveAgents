<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>סדרה — surreal-product-ad</title>
<style>
 :root{--bg:#0f1115;--card:#1a1d24;--card2:#20242d;--line:#2c313c;--ink:#e8eaed;--dim:#9aa0aa;--ok:#3fb950;--accent:#f0a63c}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Heebo",Arial,sans-serif;padding:20px}
 h1{font-size:20px;margin:0 0 4px} .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
 button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
 .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
 .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
 .hd b{font-size:15px} .hd a{color:var(--accent);font-size:12px} .hd span{color:var(--dim);font-size:12px}
 .cells{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:8px}
 .slot{position:relative;aspect-ratio:9/16;background:var(--card2);border:1px dashed var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:11px}
 .slot.has{border-style:solid} .slot img,.slot video{width:100%;height:100%;object-fit:cover}
 .slot i{position:absolute;top:5px;inset-inline-start:5px;background:rgba(0,0,0,.7);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;z-index:2}
 @media (max-width:640px){.cells{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<h1>🎞️ סדרה — surreal-product-ad</h1><div class="sub">6 פרסומות · surreal-ads · <button onclick="location.reload()">↻ רענן</button></div>
<div id="rows"></div>
<script>
const ADS = [{"title": "MELT — MADE TO MELT", "slug": "chocolate", "route": "midjourney", "mode": "hybrid", "grid": "2026-10-09-chocolate/storyboard_grid.html", "anchor": "../../cast/surreal-ads/chocolate-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-chocolate/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-chocolate/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-chocolate/keyframes/k2.png"}, {"id": "k2b", "src": "2026-10-09-chocolate/keyframes/k2b.png"}, {"id": "k3", "src": "2026-10-09-chocolate/keyframes/k3.png"}], "final": "2026-10-09-chocolate/final_typo.mp4"}, {"title": "Terra Roast — SLOW MORNINGS", "slug": "coffee", "route": "gpt", "mode": "hybrid", "grid": "2026-10-09-coffee/storyboard_grid.html", "anchor": "../../cast/surreal-ads/coffee-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-coffee/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-coffee/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-coffee/keyframes/k2.png"}, {"id": "k3", "src": "2026-10-09-coffee/keyframes/k3.png"}], "final": "2026-10-09-coffee/final.mp4"}, {"title": "Velocità — BUILT FOR THE LAST LAP", "slug": "f1", "route": "gpt", "mode": "hybrid", "grid": "2026-10-09-f1/storyboard_grid.html", "anchor": "../../cast/surreal-ads/f1-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-f1/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-f1/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-f1/keyframes/k2.png"}, {"id": "k3", "src": "2026-10-09-f1/keyframes/k3.png"}], "final": "2026-10-09-f1/final.mp4"}, {"title": "Hush — SILENCE THE WORLD", "slug": "headphones", "route": "gpt", "mode": "hybrid", "grid": "2026-10-09-headphones/storyboard_grid.html", "anchor": "../../cast/surreal-ads/headphones-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-headphones/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-headphones/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-headphones/keyframes/k2.png"}, {"id": "k3", "src": "2026-10-09-headphones/keyframes/k3.png"}], "final": "2026-10-09-headphones/final.mp4"}, {"title": "Maison Rosé — PINK YOUR LIFE", "slug": "perfume", "route": "gpt", "mode": "hybrid", "grid": "2026-10-09-perfume/storyboard_grid.html", "anchor": "../../cast/surreal-ads/perfume-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-perfume/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-perfume/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-perfume/keyframes/k2.png"}, {"id": "k3", "src": "2026-10-09-perfume/keyframes/k3.png"}], "final": "2026-10-09-perfume/final.mp4"}, {"title": "Nimbo — RUN ON AIR", "slug": "sneakers", "route": "gpt", "mode": "hybrid", "grid": "2026-10-09-sneakers/storyboard_grid.html", "anchor": "../../cast/surreal-ads/sneakers-product.png", "keyframes": [{"id": "k0", "src": "2026-10-09-sneakers/keyframes/k0.png"}, {"id": "k1", "src": "2026-10-09-sneakers/keyframes/k1.png"}, {"id": "k2", "src": "2026-10-09-sneakers/keyframes/k2.png"}, {"id": "k3", "src": "2026-10-09-sneakers/keyframes/k3.png"}], "final": "2026-10-09-sneakers/final.mp4"}];
const rows = document.getElementById('rows');
function slot(label, src, video){
  const d=document.createElement('div'); d.className='slot'; d.innerHTML=`<i>${label}</i>—`;
  if(!src) return d;
  if(video){const v=document.createElement('video'); v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true;
    v.onloadedmetadata=()=>{d.textContent='';d.classList.add('has');d.innerHTML=`<i>${label}</i>`;d.appendChild(v)}; v.src=src;}
  else {const im=new Image(); im.onload=()=>{d.classList.add('has');d.innerHTML=`<i>${label}</i>`;d.appendChild(im)}; im.src=src+'?t='+Date.now();}
  return d;
}
ADS.forEach(a=>{
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<div class="hd"><b>${a.title}</b><span>${a.slug} · ${a.route} · ${a.mode}</span><a href="${a.grid}">פתח widget ←</a></div><div class="cells"></div>`;
  const c=r.querySelector('.cells');
  c.appendChild(slot('PRODUCT', a.anchor));
  a.keyframes.forEach(k=>c.appendChild(slot(k.id.toUpperCase(), k.src)));
  c.appendChild(slot('FINAL', a.final, true));
  rows.appendChild(r);
});
</script></body></html>
