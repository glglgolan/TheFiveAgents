<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread Tear — style test</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1d1814; --ink:#3b2f25; }
  html,body { margin:0; height:100%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:Heebo,sans-serif; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
  svg { height:min(88vh, 960px); aspect-ratio:9/16; display:block; border-radius:6px; box-shadow:0 20px 60px #000a; }
  .bar { color:#d8c9b3; font-size:13px; display:flex; gap:12px; align-items:center; }
  button { font:inherit; background:#c8281e; color:#fff; border:0; border-radius:4px; padding:6px 14px; cursor:pointer; }
  label { display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
<svg id="v" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="fiber" x="-5%" y="-50%" width="110%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.25 0.9" numOctaves="2" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a1a0c" flood-opacity="0.45"/>
    </filter>
    <filter id="cutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="7" stdDeviation="4" flood-color="#2a1a0c" flood-opacity="0.35"/>
    </filter>
    <filter id="glowBlur" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1680" height="2520"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="threadShadow" x="-5%" y="-50%" width="110%" height="200%">
      <feDropShadow dx="2" dy="5" stdDeviation="2.5" flood-color="#3a0d08" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="leak" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="0.75" stop-color="#e2621d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a2a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8483a"/><stop offset="0.5" stop-color="#c8281e"/><stop offset="1" stop-color="#8e150f"/>
    </linearGradient>
    <clipPath id="clipTop"><path id="clipTopPath"/></clipPath>
    <clipPath id="clipBot"><path id="clipBotPath"/></clipPath>
  </defs>

  <!-- ===== Scene B (revealed underneath) ===== -->
  <g id="sceneB">
    <rect width="1080" height="1920" fill="#d8bf98"/>
    <rect width="1080" height="1920" fill="#d8bf98" filter="url(#grain)"/>
    <g id="bContent"></g>
  </g>

  <!-- ===== Warm light leak ===== -->
  <g id="light" style="mix-blend-mode:screen">
    <ellipse id="leakBloom" cx="540" cy="980" rx="700" ry="200" fill="url(#leak)" opacity="0"/>
    <path id="leakLine" fill="none" stroke="#ffcf7a" stroke-width="60" filter="url(#glowBlur)" opacity="0"/>
    <g id="dust"></g>
  </g>

  <!-- ===== Scene A halves (torn) ===== -->
  <g id="halfTop" filter="url(#shadow)">
    <g clip-path="url(#clipTop)"><use href="#sceneA"/></g>
    <path id="fiberTop" fill="none" stroke="#fbf6ec" stroke-width="9" filter="url(#fiber)"/>
  </g>
  <g id="halfBot" filter="url(#shadow)">
    <g clip-path="url(#clipBot)"><use href="#sceneA"/></g>
    <path id="fiberBot" fill="none" stroke="#fbf6ec" stroke-width="9" filter="url(#fiber)"/>
  </g>

  <!-- ===== Red thread (always on top) ===== -->
  <g id="threadG" filter="url(#threadShadow)">
    <g id="holes"></g>
    <path id="thread" fill="none" stroke="url(#threadGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="needle">
      <path d="M0 0 L-230 -34 L-236 -22 Z" fill="#aeb4ba"/>
      <path d="M0 0 L-230 -34" stroke="#f4f6f8" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-205" cy="-28" rx="16" ry="5" fill="#3d4146" transform="rotate(-8 -205 -28)"/>
    </g>
  </g>

  <!-- symbol source for scene A (kept hidden, used twice) -->
  <defs id="sceneASrc">
    <g id="sceneA">
      <rect width="1080" height="1920" fill="#efe6d6"/>
      <rect width="1080" height="1920" fill="#efe6d6" filter="url(#grain)"/>
      <g id="aContent"></g>
    </g>
  </defs>
</svg>
<div class="bar">
  <button id="replay">↻ נגן שוב</button>
  <label><input type="checkbox" id="slow"> הילוך איטי ×0.4</label>
  <span id="clock">0.00s</span>
</div>
</div>

<script>
// ---------- deterministic helpers ----------
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const easeIn=x=>x*x*x;
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

const FPS = 12;            // stop-motion step
const DUR = 7.0;           // seconds per loop
const W=1080, H=1920, BASE_Y=1000;

// tear line = thread line
const baseY = x => BASE_Y + 70*Math.sin(x/240 + 0.6) + 25*Math.sin(x/90);
const R = rng(42);
const EDGE = [];  // jagged tear points
for(let x=-40; x<=W+40; x+=14) EDGE.push([x, baseY(x) + (R()-.5)*22]);

// ---------- scene content (paper cut-outs) ----------
function text(parent, x, y, str, size, weight, fill, anchor='middle'){
  const t=el('text',{x,y,'font-size':size,'font-weight':weight,fill,'text-anchor':anchor,'font-family':'Heebo, sans-serif',direction:'rtl'},parent); t.textContent=str; return t;
}
function cutout(parent, x,y,w,h,fill,rot=0){
  return el('rect',{x,y,width:w,height:h,rx:10,fill,filter:'url(#cutShadow)',transform:`rotate(${rot} ${x+w/2} ${y+h/2})`},parent);
}
(function buildA(){
  const g=$('aContent');
  text(g, 540, 300, '1', 120, 900, '#c8281e');
  text(g, 540, 420, 'סטוריבורד', 110, 900, '#3b2f25');
  text(g, 540, 490, 'במבי · build_series.py', 40, 400, '#7a6550');
  const cards=[[710,650,-1.5,'#9a6b4b'],[400,600,2,'#b98a5e'],[90,640,-3,'#6b4a35']];
  cards.forEach(([x,y,r,c],i)=>{
    const cg=el('g',{transform:`rotate(${r} ${x+140} ${y+180})`},g);
    cutout(cg,x,y,280,360,'#fbf6ec');
    el('rect',{x:x+22,y:y+22,width:236,height:220,rx:6,fill:c},cg);
    el('rect',{x:x+60,y:y+120,width:160,height:100,rx:6,fill:'#2c2420'},cg);     // laptop
    el('rect',{x:x+40,y:y+218,width:200,height:14,rx:4,fill:'#4a3c33'},cg);
    text(cg, x+140, y+300, 'S'+(i+1), 54, 900, '#3b2f25');
  });
  // lower area: brief card
  const b=el('g',{transform:'rotate(-2 540 1450)'},g);
  cutout(b,180,1250,720,420,'#fbf6ec');
  text(b, 540, 1340, 'brief.json', 54, 800, '#3b2f25');
  el('rect',{x:440,y:1362,width:200,height:6,rx:3,fill:'#c8281e'},b);
  ['מותג: MELT','מוצר: שוקולד','טרנספורמציה: נמס'].forEach((s,i)=>{
    text(b, 540, 1440+i*66, s, 42, 400, '#5a4636');
  });
})();

// ---------- geometry builders ----------
function pathFrom(points){ return 'M'+points.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'); }
function smoothPath(points){
  let d=`M${points[0][0]} ${points[0][1]}`;
  for(let i=1;i<points.length;i++){ const [x0,y0]=points[i-1],[x1,y1]=points[i]; const mx=(x0+x1)/2,my=(y0+y1)/2; d+=` Q${x0} ${y0} ${mx} ${my}`; }
  const l=points[points.length-1]; return d+` L${l[0]} ${l[1]}`;
}
function edgeJitter(frame){
  const r=rng(1000+frame);           // boil: edge breathes per stop-motion frame
  return EDGE.map(([x,y])=>[x, y+(r()-.5)*4]);
}

// stitch holes along thread
const HOLES=[];
for(let x=30; x<W; x+=68){ HOLES.push(x); }
HOLES.forEach(x=>{ el('circle',{cx:x,cy:baseY(x),r:6,fill:'#2a1a10',opacity:0,'data-x':x},$('holes')); });

// dust motes
const DR=rng(7), DUST=[];
for(let i=0;i<46;i++){
  const x=DR()*W, y=baseY(x)+(DR()-.5)*80;
  DUST.push({x,y,vx:(DR()-.5)*60,vy:-60-DR()*180,r:2+DR()*5,ph:DR()*6});
  el('circle',{r:3,fill:'#ffe2a6',opacity:0},$('dust'));
}

// ---------- the frame renderer ----------
function render(t){
  const frame=Math.floor(t*FPS);
  const tq=frame/FPS;                // quantized time — the stop-motion feel
  const jr=rng(frame*31+5);
  const boil=()=> (jr()-.5)*3;       // ±1.5px layer jitter

  // phases
  const sew   = seg(tq, 0.4, 2.6);   // needle stitches across
  const pull  = seg(tq, 2.6, 3.2);   // thread pulls taut, paper puckers
  const crack = seg(tq, 3.2, 3.6);   // light seeps through the crack
  const split = seg(tq, 3.6, 5.0);   // halves tear apart
  const settle= seg(tq, 4.8, 6.4);   // thread re-sews through K frames

  // --- thread geometry ---
  const xEnd = -40 + (W+80)*easeInOut(sew);
  const amp = 1 - 0.85*easeInOut(pull);                       // wave flattens when taut
  const lift = 18*Math.sin(Math.PI*pull);                     // lifts off paper while pulling
  let pts=[];
  for(let x=-40; x<=xEnd; x+=12){
    const y = BASE_Y + amp*(baseY(x)-BASE_Y) - lift + (split>0 ? -easeIn(split)*900 : 0);
    pts.push([x,y]);
  }
  const threadEl=$('thread');
  if(settle>0){
    // second life: thread rethreads K0→K1→K2→K3 (continuity metaphor)
    const K=KCENTERS, order=[K[0],K[1],K[2],K[3]];
    const fine=[]; for(let i=0;i<order.length-1;i++){ for(let s=0;s<=1;s+=0.05){ const a=order[i],b=order[i+1];
      fine.push([a[0]+(b[0]-a[0])*s, a[1]+(b[1]-a[1])*s + 60*Math.sin(Math.PI*s)]); } }
    const n=Math.max(2,Math.floor(fine.length*easeInOut(settle)));
    pts=fine.slice(0,n);
  }
  if(pts.length>1){
    threadEl.setAttribute('d', smoothPath(pts));
    threadEl.setAttribute('stroke-dasharray', (sew<1 && settle===0) ? '44 24' : (settle>0 ? '44 24' : 'none'));
    threadEl.setAttribute('opacity', split>0.55 && settle===0 ? 0 : 1);
  } else threadEl.setAttribute('d','');
  const tip = pts[pts.length-1]||[-200,-200];
  $('needle').setAttribute('transform', `translate(${tip[0]+boil()} ${tip[1]+boil()}) rotate(${settle>0?20:0})`);
  $('needle').setAttribute('opacity', (sew>0&&sew<1)||(settle>0&&settle<1) ? 1 : 0);
  [...$('holes').children].forEach(h=>{ const x=+h.dataset.x; h.setAttribute('opacity', x<xEnd && split===0 ? 0.55 : 0); });

  // --- torn halves ---
  const E=edgeJitter(frame);
  $('clipTopPath').setAttribute('d', 'M-60 -60 L'+(W+60)+' -60 L'+pathFrom(E.slice().reverse()).slice(1)+' Z');
  $('clipBotPath').setAttribute('d', 'M-60 '+(H+60)+' L'+(W+60)+' '+(H+60)+' L'+pathFrom(E.slice().reverse()).slice(1)+' Z');
  const fiberD=pathFrom(E);
  $('fiberTop').setAttribute('d', fiberD); $('fiberBot').setAttribute('d', fiberD);
  const showFiber = crack>0 ? 1 : 0;
  $('fiberTop').setAttribute('opacity', showFiber); $('fiberBot').setAttribute('opacity', showFiber);

  const pucker = 6*Math.sin(Math.PI*pull);
  const gap = 4*crack + 0;
  const s = easeInOut(split);
  const topY = -gap - pucker - s*1150, botY = gap + pucker + s*1100;
  const topR = -6*s, botR = 5*s;
  $('halfTop').setAttribute('transform', `translate(${boil()+(-30*s)} ${topY+boil()}) rotate(${topR} 540 ${BASE_Y})`);
  $('halfBot').setAttribute('transform', `translate(${boil()+(40*s)} ${botY+boil()}) rotate(${botR} 540 ${BASE_Y})`);

  // --- light leak ---
  const lightOn = Math.max(crack*0.9*(1-s), s>0 ? 1-seg(tq,4.6,6.0) : 0);
  $('leakLine').setAttribute('d', fiberD);
  $('leakLine').setAttribute('opacity', lightOn);
  $('leakLine').setAttribute('stroke-width', 40 + 260*s);
  const bloom=$('leakBloom');
  bloom.setAttribute('opacity', (0.25*crack + 0.9*s) * (1-seg(tq,4.9,6.3)));
  bloom.setAttribute('ry', 120 + 900*s);
  bloom.setAttribute('rx', 600 + 300*s);
  // flicker per frame — like a lamp behind the paper
  $('light').setAttribute('opacity', 0.88 + jr()*0.12);

  // --- dust ---
  const dt = Math.max(0, tq-3.4);
  [...$('dust').children].forEach((c,i)=>{
    const d=DUST[i];
    c.setAttribute('cx', d.x + d.vx*dt + 10*Math.sin(dt*2+d.ph));
    c.setAttribute('cy', d.y + d.vy*dt);
    c.setAttribute('r', d.r);
    c.setAttribute('opacity', dt>0 ? Math.max(0, 0.9 - dt*0.35) : 0);
  });

  // --- scene B lands (paper drop) ---
  const land = easeOutBack(seg(tq, 3.6, 4.6));
  $('sceneB').setAttribute('transform', `translate(${boil()} ${boil() + (1-land)*20}) scale(${1.04-0.04*land}) `);
  $('sceneB').style.transformOrigin='540px 960px';

  $('clock').textContent = tq.toFixed(2)+'s · frame '+frame;
}

// ---------- loop ----------
let start=performance.now(), lastFrame=-1;
function tick(now){
  const speed=$('slow').checked?0.4:1;
  const t=((now-start)/1000*speed) % (DUR+0.8);
  const f=Math.floor(t*FPS);
  if(f!==lastFrame){ lastFrame=f; render(Math.min(t,DUR)); }
  requestAnimationFrame(tick);
}
$('replay').onclick=()=>{ start=performance.now(); lastFrame=-1; };
$('slow').onchange=()=>{ start=performance.now(); lastFrame=-1; };
window.renderAt=render;   // for QA screenshots
requestAnimationFrame(tick);
</script>
</body>
</html>
